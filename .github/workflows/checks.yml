name: Software checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-22.04, ubuntu-24.04]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi python3-gi-cairo gir1.2-gtk-4.0 libhidapi-hidraw0 gsettings-desktop-schemas xvfb dbus-x11
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install ruff==0.14.5
      - name: Lint and unit tests
        run: |
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python -m unittest discover -v
          .venv/bin/python install.py --check
      - name: GTK and source package
        run: |
          dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo TITAN_RGB_UI_TESTS=1 .venv/bin/python -m unittest test_ui -v
          .venv/bin/python build_source.py
  fedora:
    runs-on: ubuntu-24.04
    container: fedora:43
    timeout-minutes: 15
    steps:
      - name: System dependencies
        run: dnf install -y git python3 python3-pip python3-gobject gtk4 hidapi gsettings-desktop-schemas xorg-x11-server-Xvfb xorg-x11-xauth dbus-daemon
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Software checks
        run: |
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install ruff==0.14.5
          .venv/bin/ruff check .
          .venv/bin/ruff format --check .
          .venv/bin/python -m unittest discover -v
          .venv/bin/python install.py --check
          dbus-run-session -- xvfb-run -a env GSK_RENDERER=cairo TITAN_RGB_UI_TESTS=1 .venv/bin/python -m unittest test_ui -v
          .venv/bin/python build_source.py
